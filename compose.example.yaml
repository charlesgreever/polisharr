# Copy this file to compose.yaml. Set the media bind to the same path
# Radarr and Sonarr report. NVIDIA is the default. For Intel, see the
# commented block at the bottom. A second GPU box is compose.worker.yaml.
#
#   docker compose up -d
#
# Prebuilt image: ghcr.io/charlesgreever/polisharr (tags: latest, 0.2.0).
# To build from this tree instead, comment image and uncomment build.

name: polisharr
services:
  polisharr:
    container_name: polisharr
    image: ghcr.io/charlesgreever/polisharr:latest
    # build: .
    ports:
      - "7373:7373"
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: UTC
      CONFIG_DIR: /config
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility,video
      WHISPER_LID: /usr/local/bin/whisper-lid
      PGS_OCR: /usr/local/bin/pgs-ocr
    volumes:
      - ./config:/config
      - /path/to/media:/path/to/media
    runtime: nvidia
    # Intel GPU: comment out runtime and the NVIDIA_* variables above, then uncomment:
    # devices:
    #   - /dev/dri:/dev/dri
    # group_add:
    #   - "992"
